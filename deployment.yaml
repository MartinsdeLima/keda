apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-php-demo
  namespace: keda-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda-php-demo
  template:
    metadata:
      labels:
        app: keda-php-demo
    spec:
      containers:
        - name: keda-php-demo
          image: martinslima/keda-php-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keda-php-demo
  namespace: keda-demo
spec:
  type: NodePort
  selector:
    app: keda-php-demo
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080